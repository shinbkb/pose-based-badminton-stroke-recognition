[project]
name = "pbl5-doantotnghiep"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "opencv-python-headless",
    "tqdm",
    "jupyter",
    "ipykernel",
    "rtmlib",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
    "gdown>=6.4.0",
    "ultralytics>=8.4.175",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[tool.uv]
exclude-dependencies = [
    "onnxruntime",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
